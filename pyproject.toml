[project]
name = "hydrogym"
version = "1.0.0"
description = "A Reinforcement Learning Benchmarking Environment for Fluid Dynamics (with Firedrake, JAX-Fluids, MAIA, and NEK5000 solver support)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "HydroGym Team" },
]
maintainers = [
    { name = "Christian Lagemann", email = "clage@uw.edu" },
    { name = "Ludger Paehler", email = "paehlerludger@gmail.com" },
    { name = "Jared Callaham", email = "jared.callaham@gmail.com" },
]
keywords = [
    "Reinforcement Learning",
    "Scientific Machine Learning",
    "Benchmarking",
    "Computational Fluid Dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "control>=0.9.2",
    "dmsuite>=0.1.1",
    "gymnasium>=1.2.3",
    "huggingface-hub>=0.16.0",
    "numpy>=1.23",
    "pandas>=2.1.0",
    "scipy>=1.7.0",
]

[project.urls]
Documentation = "https://dynamicslab.github.io/hydrogym"
Repository = "https://github.com/dynamicslab/hydrogym"
Issues = "https://github.com/dynamicslab/hydrogym/issues"

[project.optional-dependencies]
firedrake = [
    "gmsh>=4.11.1",
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "psutil>=7.2.2",
]
maia = [
    "einops>=0.6.0",
    "mpi4py>=4.0.0",
    "omegaconf>=2.1.0",
    "toml>=0.10.0",
]
nek = [
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "omegaconf>=2.1.0",
    "pettingzoo>=1.24.0",
    "pymech>=1.4.0",
    "stable-baselines3>=2.7.1",
    "supersuit==3.10.0",
    "tensorboard>=2.0.0",
]
jax = [
    "chex",
    "flax",
    "gymnax",
    "jax",
    "jaxlib",
    "matplotlib>=3.7",
    "navix",
    "omegaconf>=2.1.0",
    "toml>=0.10.0",
    "tree-math",
]
jaxfluids = [
    "flax",
    "gitpython",
    "h5py",
    "jax",
    "jaxlib",
    "matplotlib>=3.7",
    "omegaconf>=2.1.0",
    "optax",
    "pyvista",
]
all = [
    "chex",
    "einops>=0.6.0",
    "flax",
    "gitpython",
    "gmsh>=4.11.1",
    "gymnax",
    "h5py",
    "jax",
    "jaxlib",
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "navix",
    "omegaconf>=2.1.0",
    "optax",
    "pettingzoo>=1.24.0",
    "psutil>=7.2.2",
    "pymech>=1.4.0",
    "pyvista",
    "stable-baselines3>=2.7.1",
    "supersuit==3.10.0",
    "tensorboard>=2.0.0",
    "toml>=0.10.0",
    "tree-math",
]

[dependency-groups]
dev = [
    "codespell>=2.2.6,<3",
    "isort>=6,<7",
    "psutil>=7.0.2,<8",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.8,<0.16",
    "toml>=0.10.2,<0.11",
    "tomli>=2.0.1,<3",
]
docs = [
    "pydoc-markdown>=4.8.2,<5",
]
interactive = [
    "ipykernel>=6.29,<7",
    "ipywidgets>=8,<9",
    "jupyterlab>=4.5.10,<5",
    "memory-profiler>=0.61,<0.62",
    "mpltools>=0.2,<0.3",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "notebook>=7.4,<8",
    "seaborn>=0.13,<0.14",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E731"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["hydrogym"]

[tool.codespell]
skip = "*.svg,*.ipynb,docs/package-lock.json,docs/node_modules,docs/build,docs/.docusaurus"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-name = "hydrogym"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
