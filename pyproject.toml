[project]
name = "hydrogym"
version = "1.0.2"
description = "A Reinforcement Learning Benchmarking Environment for Fluid Dynamics (with Firedrake, JAX, JAX-Fluids, m-AIA, Nek5000 and NekRS solver support)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "HydroGym Team" },
]
maintainers = [
    { name = "Christian Lagemann", email = "clage@uw.edu" },
    { name = "Ludger Paehler", email = "paehlerludger@gmail.com" },
    { name = "Jared Callaham", email = "jared.callaham@gmail.com" },
]
keywords = [
    "Reinforcement Learning",
    "Scientific Machine Learning",
    "Benchmarking",
    "Computational Fluid Dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "control>=0.9.2",
    "dmsuite>=0.1.1",
    "gymnasium>=1.2.3",
    "huggingface-hub>=0.16.0",
    "numpy>=1.23",
    "pandas>=2.1.0",
    "scipy>=1.7.0",
]

[project.urls]
Documentation = "https://dynamicslab.github.io/hydrogym"
Repository = "https://github.com/dynamicslab/hydrogym"
Issues = "https://github.com/dynamicslab/hydrogym/issues"
Changelog = "https://github.com/dynamicslab/hydrogym/blob/main/CHANGELOG.md"

[project.optional-dependencies]
firedrake = [
    "gmsh>=4.11.1",
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "psutil>=7.2.2",
]
maia = [
    "einops>=0.6.0",
    "mpi4py>=4.0.0",
    "omegaconf>=2.1.0",
    "pyarrow>=14.0",
    "stable-baselines3>=2.7.1",
    "tensorboard>=2.0.0",
    "toml>=0.10.0",
]
nek = [
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "omegaconf>=2.1.0",
    "pettingzoo>=1.24.0",
    "pymech>=1.4.0",
    "stable-baselines3>=2.7.1",
    "supersuit==3.11.0",
    "tensorboard>=2.0.0",
]
nekrs = [
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "omegaconf>=2.1.0",
    "pettingzoo>=1.24.0",
    "pymech>=1.4.0",
    "pyyaml>=6.0",
    "stable-baselines3>=2.7.1",
    "supersuit==3.11.0",
    "tensorboard>=2.0.0",
]
jax = [
    "chex",
    "flax",
    "gymnax>=0.0.9,<1",
    "imageio",
    "jax",
    "jaxlib",
    "matplotlib>=3.7",
    "navix>=4.0.0; python_full_version >= '3.12'",
    "omegaconf>=2.1.0",
    "toml>=0.10.0",
    "tree-math",
]
jaxfluids = [
    "flax",
    "gitpython",
    "h5py",
    "jax",
    "jaxlib",
    "matplotlib>=3.7",
    "omegaconf>=2.1.0",
    "optax",
    "pyvista",
]
all = [
    "chex",
    "einops>=0.6.0",
    "flax",
    "gitpython",
    "gmsh>=4.11.1",
    "gymnax>=0.0.9,<1",
    "h5py",
    "imageio",
    "jax",
    "jaxlib",
    "matplotlib>=3.7",
    "mpi4py>=4.0.0",
    "navix>=4.0.0; python_full_version >= '3.12'",
    "omegaconf>=2.1.0",
    "optax",
    "pettingzoo>=1.24.0",
    "psutil>=7.2.2",
    "pyarrow>=14.0",
    "pymech>=1.4.0",
    "pyvista",
    "pyyaml>=6.0",
    "stable-baselines3>=2.7.1",
    "supersuit==3.11.0",
    "tensorboard>=2.0.0",
    "toml>=0.10.0",
    "tree-math",
]

[dependency-groups]
dev = [
    "codespell>=2.2.6,<3",
    "isort>=6,<10",
    "psutil>=7.0.2,<8",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.8,<0.17",
    "toml>=0.10.2,<0.11",
    "tomli>=2.0.1,<3",
]
docs = [
    "pydoc-markdown>=4.8.2,<5",
]
interactive = [
    "ipykernel>=6.29,<8",
    "ipywidgets>=8,<9",
    "jupyterlab>=4.5.10,<5",
    "memory-profiler>=0.61,<0.62",
    "mpltools>=0.2,<0.3",
    "nbconvert>=7.16,<8",
    "nbformat>=5.10,<6",
    "notebook>=7.4,<8",
    "seaborn>=0.13,<0.14",
]

[tool.ruff]
line-length = 120
extend-exclude = ["third_party"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E731"]

[tool.ruff.lint.per-file-ignores]
# NekRS post-processing and report scripts: long table/format lines and the
# conventional `l` loop name; imports after argparse / matplotlib.use("Agg").
"examples/nekrs/wing/bl_report.py" = ["E501", "E741"]
"examples/nekrs/wing/bl_stats.py" = ["E501", "E741"]
"examples/nekrs/perf_report.py" = ["E741"]
"examples/nekrs/wing/obs_shift.py" = ["E402", "E741"]
"examples/nekrs/wing/postprocess.py" = ["E402"]
"examples/nekrs/wing/fit_utau.py" = ["E402"]
"examples/nekrs/channel/client.py" = ["E402"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["hydrogym"]
skip_glob = ["third_party/*"]

[tool.codespell]
skip = "*.svg,*.ipynb,docs/package-lock.json,docs/node_modules,docs/build,docs/.docusaurus,./third_party/*"
# Variable names and notation (radY: radius in y, Ue: edge velocity, te: terminated, nd: normal distance,
# wth: quadrature weights in theta, oint: contour integral, astroid: a package name).
ignore-words-list = "rady,ue,te,nd,wth,oint,astroid"

[tool.uv]
default-groups = ["dev"]
# navix (jax extras) requires tyro, whose docstring-parser range excludes the one of pydoc-markdown (docs group).
conflicts = [
    [{ group = "docs" }, { extra = "jax" }],
    [{ group = "docs" }, { extra = "all" }],
]
# soupsieve releases for Python < 3.11.5 have known vulnerabilities: resolve without soupsieve there
# (beautifulsoup4 4.6.3, as before) and with soupsieve >= 4.0 elsewhere.
constraint-dependencies = ["soupsieve>=4.0; python_full_version >= '3.11.5'", "soupsieve<0; python_full_version < '3.11.5'"]

[tool.uv.build-backend]
module-name = "hydrogym"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = ["solver: runs a real solver binary (m-AIA); set HYDROGYM_SOLVER_TESTS=1"]
