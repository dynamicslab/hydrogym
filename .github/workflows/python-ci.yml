name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install quality tools
        run: uv sync --locked --only-group dev --no-install-project

      - name: Check lockfile
        run: uv lock --check

      - name: Audit locked dependencies
        run: uv audit --locked

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check --diff .

      - name: Check import ordering
        run: uv run --no-sync isort . --check-only --diff

      - name: Check spelling
        run: >-
          uv run --no-sync codespell --toml pyproject.toml
          README.md CONTRIBUTING.md docs examples test hydrogym

  core:
    name: Core import (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked core environment
        run: uv sync --locked --no-default-groups

      - name: Import core package
        run: uv run --no-sync python -c "import hydrogym; print(hydrogym.__all__)"

  package:
    name: Package distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build --no-sources

      - name: Verify distribution contents and metadata
        run: python scripts/verify_distribution.py dist

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl -- python -c "import hydrogym"

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz -- python -c "import hydrogym"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
