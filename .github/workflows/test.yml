name: Test

# Runs the pytest suite (test/) in the published CPU image.
#
# Design notes:
# - The image `clagemann/hydrogym-cpu:<version>` has the solver backends and Firedrake built in; the checkout is
#   mounted into it, so the suite tests the commit under test. The gradient tests (test_*_grad.py) are excluded: they
#   import firedrake_adjoint, which the Firedrake environment does not provide.
# - `lfs: true` on checkout is required: meshes (*.msh, *.re2, ...) are LFS
#   pointers otherwise.
# - Tests that need a real solver binary (m-AIA, Nek5000, NekRS) are not part of pytest; the image smoke tests are
#   `.devcontainer/scripts/test_release_image.sh` and `test_apptainer_image.sh`.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docstring-coverage:
    # Enforce the docstring-coverage floor so it cannot silently regress.
    # The measurement tool is stdlib-only, so this job needs no
    # dependencies and runs in seconds.
    name: Docstring coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Measure docstring coverage
        run: python test/measure_docstrings.py --fail-under 99

  developer-template-skeletons:
    # The reference skeletons under examples/developer_templates/ must stay
    # runnable without Firedrake, MPI, GPU or solver binaries. This job
    # deliberately does not install hydrogym or any backend dependency --
    # only gymnasium + numpy, matching hydrogym/core.py's own imports --
    # so a change that couples the skeletons to a backend dependency
    # fails here.
    name: Developer-template skeletons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimal deps
        run: pip install --no-cache-dir pytest gymnasium numpy
      - name: Run skeleton tests
        run: python -m pytest examples/developer_templates/ -q

  image-tests:
    # The suite runs inside the published CPU image (`docs/docs/installation/containers.md`), which has the
    # solver backends, JAX and Firedrake built in. The checkout is mounted over the image's sources and put first on
    # the PYTHONPATH, so the tests exercise the code of the commit under test with the image's solvers. The suite is
    # run in both Python environments of the image: tests of a backend that is not installed in one of them skip.
    name: Test suite (CPU image)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: clagemann/hydrogym-cpu:1.0.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android \
            /usr/share/swift
          df -h /

      - name: Pull the image
        run: docker pull "${IMAGE}"

      - name: Run the suite (HydroGym environment)
        run: |
          docker run --rm --ipc=host \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PYTHONPATH=/workspace -e JAX_PLATFORMS=cpu -e OMP_NUM_THREADS=2 \
            "${IMAGE}" \
            python -m pytest test -p no:cacheprovider -ra --durations=10 \
              --ignore-glob='test/test_*_grad.py'

      - name: Run the suite (Firedrake environment)
        run: |
          docker run --rm --ipc=host \
            -v "${{ github.workspace }}:/workspace" -w /workspace \
            -e PYTHONPATH=/workspace -e OMP_NUM_THREADS=2 \
            "${IMAGE}" \
            bash -c 'source /opt/venvs/firedrake/bin/activate &&
              python -m pytest test -p no:cacheprovider -ra --durations=10 \
                --ignore-glob="test/test_*_grad.py"'
